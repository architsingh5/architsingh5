<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Archit Singh</title>
  <desc id="d">Software Engineer at Goldman Sachs building high-throughput Java services and Kafka pipelines. Animated banner of messages flowing through partitions.</desc>
  <style>
    .m { animation-name: flow; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes flow { from { transform: translateX(-60px); } to { transform: translateX(1220px); } }
    @media (prefers-reduced-motion: reduce) { .m { animation: none; } }
    .name { font: 700 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -2px; fill: #e8e6e1; }
    .sub { font: 400 23px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9aa0a8; }
    .sub b { font-weight: 600; fill: #e8e6e1; }
    .eyebrow { font: 500 17px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #9aa0a8; letter-spacing: 0.5px; }
    .lbl { font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #9aa0a8; opacity: 0.8; }
    .pulse { animation: pulse 2s ease-out infinite; transform-origin: 63px 83px; }
    @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
