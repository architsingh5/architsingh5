name: Refresh profile cards

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch LeetCode stats
        run: python scripts/update_leetcode.py
      - name: Redraw cards
        run: python scripts/make_cards.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data assets; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git commit -m "Refresh profile cards"
          git push
